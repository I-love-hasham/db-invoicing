name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not tags.
# (trivy-action's tags were hijacked in March 2026 — CVE-2026-33634.)
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt -r requirements-audit.txt
      - name: Tests
        run: python -m pytest -q
      - name: pip-audit (Python dependency vulnerabilities)
        run: pip-audit -r requirements.txt --progress-spinner off

  image-scan:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t db-invoicing:ci .
      - name: Smoke test (container starts locked down and answers)
        run: |
          gen() { python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"; }
          printf 'SECRET_KEY=%s\nAUDIT_HMAC_KEY=%s\nENCRYPTION_KEY=%s\nSETUP_TOKEN=%s\n' "$(gen)" "$(gen)" "$(gen)" "$(gen)" > ci.env
          docker run -d --name smoke --env-file ci.env --read-only --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 db-invoicing:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login)
          docker logs smoke
          test "$code" = 302
          test "$(docker exec smoke id -u)" = 10001
          rm -f ci.env
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: db-invoicing:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.69.3   # pinned Trivy release (known-good per GHSA-69fq-xp46-6x23)
