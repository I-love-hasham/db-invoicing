{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
    <label for="new_password">New password (12+ characters)</label>
    <input type="password" id="new_password" name="new_password" required minlength="12" maxlength="128" autocomplete="new-password">
    <label for="new_password_confirm">Confirm new password</label>
    <input type="password" id="new_password_confirm" name="new_password_confirm" required autocomplete="new-password">
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
