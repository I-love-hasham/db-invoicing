{% extends "base.html" %}
{% block title %}Email copy{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Email copy &amp; alert address</h1>
  <p class="muted">Gets a copy of every invoice and reminder the app sends, and receives the security alerts.
    Use your regular mailbox.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="address">Address</label>
    <input type="text" id="address" name="address" value="{{ copy.address }}" required maxlength="254">
    <label for="mode">Copy as</label>
    <select id="mode" name="mode">
      <option value="cc" {% if copy.mode == 'cc' %}selected{% endif %}>CC (client sees it)</option>
      <option value="bcc" {% if copy.mode == 'bcc' %}selected{% endif %}>BCC (hidden)</option>
    </select>
    <label><input type="checkbox" name="enabled" value="1" {% if copy.enabled %}checked{% endif %}> Copy every outgoing email</label>
    <button type="submit">Save</button>
  </form>
</div>
{% endblock %}
